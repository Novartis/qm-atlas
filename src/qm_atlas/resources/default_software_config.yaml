# Default software environment configuration for qm_atlas.
#
# This file defines all supported software environments with their default
# command names. All environments are marked "available: false" by default.
#
# DO NOT edit this file. To configure your installation, create a copy of
# example_software_config.yaml, adjust it, and point the environment variable
# QM_ATLAS_SOFTWARE_CONFIG_FILE to it. Fields you specify will be merged
# (field-by-field) into these defaults; fields you omit are inherited from here.
#
# Consequence for tests: any software marked "available: false" (either because
# no config file is provided or because the entry is left at its default) will
# cause tests that depend on that software to be skipped automatically.

software_environments:

    xtb:
        available: false
        commands:
            xtb: "xtb"
        thread_control_env_vars: ["OMP_NUM_THREADS", "MKL_NUM_THREADS"]

    turbomole:
        available: false
        commands:
            ridft: "ridft"
            freeh: "freeh"
            jobex: "jobex"
            Fukui: "Fukui"
            mpshift: "mpshift"
            vcd: "vcd"
            aoforce: "aoforce"
            x2t: "x2t"
        thread_control_env_vars: ["PARNODES"]

    xtb_turbomole:
        available: false
        commands:
            xtb: "xtb"
            x2t: "x2t"
        thread_control_env_vars: ["PARNODES", "OMP_NUM_THREADS", "MKL_NUM_THREADS"]

    cosmotherm:
        available: false
        commands:
            cosmotherm: "cosmotherm"

    jaguar:
        available: false
        commands:
            jaguar: "jaguar"
            structconvert: "$SCHRODINGER/utilities/structconvert"
            lictool: "$SCHRODINGER/run lictool status"

    macromodel:
        available: false
        commands:
            bmin: "bmin"
            structconvert: "$SCHRODINGER/utilities/structconvert"
            lictool: "$SCHRODINGER/run lictool status"
            macrocycle: "$SCHRODINGER/run -FROM psp macrocycle_sample.py"

    moe:
        available: false
        commands:
            moebatch: "moebatch"

    moka:
        available: false
        commands:
            moka_cli: "moka_cli"
            blabber_sd: "blabber_sd"

    corina:
        available: false
        commands:
            corina: "corina"

    openeye:
        available: false
        commands:
            omega: "omega2"
            oeomega_macrocycle: "oeomega macrocycle"

    unicon:
        available: false
        commands:
            unicon: "unicon"
