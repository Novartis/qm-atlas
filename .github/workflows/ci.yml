name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (default software config)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project and dev dependencies
        run: uv sync --extra dev

      # No QM_ATLAS_SOFTWARE_CONFIG_FILE is set, so all programs default to
      # `available: false`. Tests that require licensed/commercial software
      # (Turbomole, COSMOtherm, Jaguar, MOE, MacroModel, OMEGA, MoKa, ...) are
      # skipped automatically. The full suite must be run separately on a system
      # where those programs are installed and enabled.
      - name: Run software-independent tests
        run: uv run pytest tests/

  lint:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install project and dev dependencies
        run: uv sync --extra dev

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
