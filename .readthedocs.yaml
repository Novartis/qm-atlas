# Read the Docs configuration for qm_atlas.
# Docs: https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Read the Docs manages versions itself (one build per activated branch/tag),
# so this performs a single-version Sphinx build. The local `sphinx-polyversion`
# setup (docs/poly.py) is independent and only used for local multi-version builds.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Install uv and let it resolve dependencies into the RTD virtualenv.
    # All dependencies are on PyPI; uv is used for fast, reproducible installs.
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --extra docs

# RTD runs the Sphinx build itself in the environment created above.
sphinx:
  configuration: docs/conf.py
